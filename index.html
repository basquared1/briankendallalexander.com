<!DOCTYPE html>
<html lang="en">
<head>

<meta name="robots" content="noindex, nofollow">
<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #faf9f7;
    color: #1a1a1a;

  @media (prefers-color-scheme: dark) {
    body { background: #16150f; color: #f0eee9; }
